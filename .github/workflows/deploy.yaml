name: Deploy Union Task

on:
  workflow_call:
    inputs:
      flyte-task-file:
        description: "Path to the task file, relative to working-directory (e.g., ./mytasks/task.py)."
        required: true
        type: string
      flyte-task-version:
        description: "Version identifier for the deployed Flyte tasks. If omitted, Flyte uses its default versioning."
        required: false
        type: string
      dependency-file:
        description: "Path to pyproject.toml or a requirements*.txt file, relative to working-directory."
        required: true
        type: string
      pyproject-groups:
        description: "Comma-separated pyproject.toml dependency groups to install alongside project dependencies and uv's default groups (e.g., foo,bar,baz)."
        required: false
        type: string
      union-project:
        description: ""
        required: true
        type: string
      union-domain:
        description: "Development, staging or production"
        required: true
        type: string
      environment:
        description: "Internal, platform team only. Target GCP environment, 'dev' or 'prod'. Consumers should leave this as the default ('prod')."
        required: false
        default: prod
        type: string
      python-version:
        description: "Python version to use for the virtual environment. Only relevant if not using pyproject.toml."
        required: false
        type: string
      working-directory:
        description: "Directory relative to the repository root used for validation, installation, config creation, and deployment. Task and dependency file paths are relative to this directory."
        required: false
        type: string
        default: "."
      run-task:
        description: "Run the task when deployed"
        required: false
        type: boolean
        default: false

jobs:
  deploy-union-task:
    if: ${{ !github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: dataplattform-runner
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout calling repo
        uses: actions/checkout@v4

      - id: config
        name: Validate inputs and resolve environment configuration
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          UNION_PROJECT: ${{ inputs.union-project }}
          UNION_DOMAIN: ${{ inputs.union-domain }}
          REPOSITORY: ${{ github.repository }}
          DEPENDENCY_FILE: ${{ inputs.dependency-file }}
          FLYTE_TASK_FILE: ${{ inputs.flyte-task-file }}
          FLYTE_TASK_VERSION: ${{ inputs.flyte-task-version }}
          PYTHON_VERSION: ${{ inputs.python-version }}
          PYPROJECT_GROUPS: ${{ inputs.pyproject-groups }}
          RUN_TASK: ${{ inputs.run-task }}
        run: |
          set -euo pipefail

          errors=()

          case "$ENVIRONMENT" in
            prod)
              provider="projects/430580391891/locations/global/workloadIdentityPools/ci-dataplattform/providers/ci-dataplattform"
              ;;
            dev)
              provider="projects/483437874962/locations/global/workloadIdentityPools/ci-dataplattform/providers/ci-dataplattform"
              ;;
            *)
              errors+=("Invalid environment '$ENVIRONMENT' - must be 'dev' or 'prod'.")
              ;;
          esac

          # Reject values that could inject extra lines/keys into GITHUB_OUTPUT.
          if [[ ! "$UNION_PROJECT" =~ ^[A-Za-z0-9-]+$ ]]; then
            errors+=("Invalid union-project '$UNION_PROJECT' - only alphanumeric characters and hyphens are allowed.")
          fi

          case "$UNION_DOMAIN" in
            development|staging|production) ;;
            *)
              errors+=("Invalid union-domain '$UNION_DOMAIN' - must be 'development', 'staging' or 'production'.")
              ;;
          esac

          if [[ "$FLYTE_TASK_FILE" != *.py ]]; then
            errors+=("Invalid flyte-task-file '$FLYTE_TASK_FILE' - must be a Python (.py) file.")
          elif [[ ! -f "$FLYTE_TASK_FILE" ]]; then
            errors+=("flyte-task-file '$FLYTE_TASK_FILE' does not exist.")
          fi

          dependency_file_basename="$(basename "$DEPENDENCY_FILE")"
          if [[ "$dependency_file_basename" != "pyproject.toml" && "$dependency_file_basename" != requirements*.txt ]]; then
            errors+=("Invalid dependency-file '$DEPENDENCY_FILE' - must be 'pyproject.toml' or a 'requirements*.txt' file.")
          elif [[ ! -f "$DEPENDENCY_FILE" ]]; then
            errors+=("dependency-file '$DEPENDENCY_FILE' does not exist.")
          elif [[ "$dependency_file_basename" == "pyproject.toml" ]]; then
            dependency_dir="$(dirname "$DEPENDENCY_FILE")"
            #if [[ ! -f "${dependency_dir}/uv.lock" ]]; then
            #  errors+=("uv.lock not found next to '$DEPENDENCY_FILE' - required for 'uv sync --frozen'.")
            #fi
          fi

          if [[ -n "$PYPROJECT_GROUPS" ]]; then
            if [[ "$dependency_file_basename" != "pyproject.toml" ]]; then
              errors+=("pyproject-groups requires a pyproject.toml dependency-file")
            fi
            if [[ ! "$PYPROJECT_GROUPS" =~ ^[A-Za-z0-9._-]+(,[A-Za-z0-9._-]+)*$ ]]; then
              errors+=("Invalid pyproject-groups: use comma-separated, nonempty group names")
            fi
          fi

          if [[ -n "$PYTHON_VERSION" && ! "$PYTHON_VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            errors+=("Invalid python-version '$PYTHON_VERSION' - must be in the form 'X.Y' or 'X.Y.Z'.")
          fi

          if [[ "$FLYTE_TASK_VERSION" =~ [[:cntrl:]] ]]; then
            errors+=("Invalid version: control characters are not allowed.")
          fi
          
          if [[ "$RUN_TASK" != "true" && "$RUN_TASK" != "false" ]]; then
            errors+=("Invalid run-task: must be a boolean (true or false).")
          fi

          if (( ${#errors[@]} > 0 )); then
            for err in "${errors[@]}"; do
              echo "::error::$err" >&2
            done
            exit 1
          fi

          repo="${REPOSITORY##*/}"
          # GSA account_id is capped at 30 chars; terraform truncates the repo to 26 ("ud-" prefix = 3).
          sa_repo="${repo:0:26}"


          {
            echo "provider=${provider}"
            echo "flyte_api_key_secret=union-api-key-${UNION_PROJECT}"
            echo "flyte_task_file=$(realpath "${FLYTE_TASK_FILE}")"
            echo "gcp_project=nav-data-union-restricted-${ENVIRONMENT}"
            echo "service_account=ud-${sa_repo}@nav-data-union-restricted-${ENVIRONMENT}.iam.gserviceaccount.com"
          } >> "$GITHUB_OUTPUT"

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          github-token: ${{ github.token }}

      - id: auth
        name: Authenticate with Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          token_format: access_token
          workload_identity_provider: ${{ steps.config.outputs.provider }}
          service_account: ${{ steps.config.outputs.service_account }}

      - name: Install workflow dependencies
        id: install
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          DEPENDENCY_FILE: ${{ inputs.dependency-file }}
          PYTHON_VERSION: ${{ inputs.python-version }}
          UV_INDEX: gar=https://europe-west1-python.pkg.dev/nav-data-images-prod/pypi/simple
          UV_INDEX_GAR_USERNAME: oauth2accesstoken
          UV_INDEX_GAR_PASSWORD: ${{ steps.auth.outputs.access_token }}
          PYPROJECT_GROUPS: ${{ inputs.pyproject-groups }}
        run: |
          set -euo pipefail

          dependency_file_basename="$(basename "$DEPENDENCY_FILE")"
          dependency_file_dir="$(dirname "$DEPENDENCY_FILE")"
          venv_path="$RUNNER_TEMP/union-deploy-venv"

          if [ "$dependency_file_basename" = "pyproject.toml" ]; then
            if [[ -f "$dependency_file_dir/uv.lock" ]]; then 
              rm -f "$dependency_file_dir/uv.lock"
            fi

            args=(sync --project "$dependency_file_dir")
            if [[ -n "$PYPROJECT_GROUPS" ]]; then
              IFS=, read -r -a groups <<< "$PYPROJECT_GROUPS"
              for group in "${groups[@]}"; do
                args+=(--group "$group")
              done
            fi

            UV_PROJECT_ENVIRONMENT="$venv_path" uv "${args[@]}"
          else
            args=(venv "$venv_path")
            if [ -n "$PYTHON_VERSION" ]; then
              args+=(--python "$PYTHON_VERSION")
            fi
            uv "${args[@]}"
            uv pip install --python "$venv_path/bin/python" -r "$DEPENDENCY_FILE"
          fi

          {
            echo "venv_path=${venv_path}"
          } >> "$GITHUB_OUTPUT"

      - name: Verify flyte is installed
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          VENV_PATH: ${{ steps.install.outputs.venv_path }}
        run: |
          set -euo pipefail
          if ! "$VENV_PATH/bin/python" -c "import flyte"; then
            echo "::error::Unable to import 'flyte' from the task environment. Check the dependencies and the error above." >&2
            exit 1
          fi

      - name: Get flyte API key
        uses: google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262 # v3.0.0
        with:
          secrets: |-
            FLYTE_API_KEY:${{ steps.config.outputs.gcp_project }}/${{ steps.config.outputs.flyte_api_key_secret }}/latest
          encoding: base64
          export_to_environment: true

      - name: Create flyte config
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          VENV_PATH: ${{ steps.install.outputs.venv_path }}
          UNION_PROJECT: ${{ inputs.union-project }}
          UNION_DOMAIN: ${{ inputs.union-domain }}
        run: |
          set -euo pipefail
          "$VENV_PATH/bin/flyte" create config --project "$UNION_PROJECT" --domain "$UNION_DOMAIN" --builder remote --force

      - name: Deploy
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          VENV_PATH: ${{ steps.install.outputs.venv_path }}
          FLYTE_TASK_FILE: ${{ steps.config.outputs.flyte_task_file }}
          FLYTE_TASK_VERSION: ${{ inputs.flyte-task-version }}
        run: |
          set -euo pipefail
          args=(--all)
          if [[ -n "$FLYTE_TASK_VERSION" ]]; then
            args+=(--version "$FLYTE_TASK_VERSION")
          fi
          args+=("$FLYTE_TASK_FILE")

          "$VENV_PATH/bin/flyte" deploy "${args[@]}"

      - name: Run
        working-directory: ${{ inputs.working-directory }}
        env:
          VENV_PATH: ${{ steps.install.outputs.venv_path }}
          FLYTE_TASK_FILE: ${{ steps.config.outputs.flyte_task_file }}
          FLYTE_TASK_VERSION: ${{ inputs.flyte-task-version }}
        if: ${{inputs.run-task == true }}
        run: |
          set -euo pipefail
          args=(--all)
          if [[ -n "$FLYTE_TASK_VERSION" ]]; then
            args+=(--version "$FLYTE_TASK_VERSION")
          fi
          args+=("$FLYTE_TASK_FILE")

          "$VENV_PATH/bin/flyte" run "${args[@]}"
        

      - name: Clear flyte API key
        if: always()
        shell: bash
        run: echo "FLYTE_API_KEY=" >> "$GITHUB_ENV"
