name: Deploy test container task

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy.yaml
      - tests/tasks/container-task/**
      - '!tests/tasks/container-task/**/*.md'
      - .github/workflows/deploy-test-container-task.yaml
  pull_request:
    paths:
      - .github/workflows/deploy.yaml
      - tests/tasks/container-task/**
      - '!tests/tasks/container-task/**/*.md'
      - .github/workflows/deploy-test-container-task.yaml
  workflow_dispatch:

jobs:
  deploy-dev:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yaml
    with:
      flyte-task-file: ./tests/tasks/container-task/main.py
      dependency-file: ./tests/tasks/container-task/pyproject.toml
      union-project: dataplattform
      union-domain: development
      environment: dev
  deploy-prod:
    needs: deploy-dev
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yaml
    with:
      flyte-task-file: ./tests/tasks/container-task/main.py
      dependency-file: ./tests/tasks/container-task/pyproject.toml
      union-project: dataplattform
      union-domain: development
      environment: prod
