name: Test deploy action

# Runs the deploy action/workflow against the example tasks in test/tasks/ whenever
# either changes, so a broken action.yaml or deploy.yaml is caught before release.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy.yaml
  pull_request:
    paths:
      - .github/workflows/deploy.yaml
  workflow_dispatch:


jobs:
  pyproject-dependecy-file-dev:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yaml
    with:
      flyte-task-file: ./tests/tasks/pyproject-dependency-file/main.py
      dependency-file: ./tests/tasks/pyproject-dependency-file/pyproject.toml
      union-project: dataplattform
      union-domain: production
      environment: dev
  pyproject-single-group-dev:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yaml
    with:
      working-directory: ./tests/tasks/pyproject-groups
      flyte-task-file: pytest_task.py
      dependency-file: pyproject.toml
      union-project: dataplattform
      union-domain: development
      environment: dev
      pyproject-groups: pytest-task
  pyproject-multiple-groups-dev:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yaml
    with:
      working-directory: ./tests/tasks/pyproject-groups
      flyte-task-file: numpy_pytest_task.py
      dependency-file: pyproject.toml
      union-project: dataplattform
      union-domain: development
      environment: dev
      pyproject-groups: pytest-task,numpy-task
  pyproject-workspace-dev:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yaml
    with:
      working-directory: ./tests/tasks/pyproject-workspace/packages/task
      flyte-task-file: main.py
      dependency-file: pyproject.toml
      union-project: dataplattform
      union-domain: development
      environment: dev
  flyte-task-version-dev:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yaml
    with:
      flyte-task-file: ./tests/tasks/pyproject-dependency-file/main.py
      flyte-task-version: 0.0.3
      dependency-file: ./tests/tasks/pyproject-dependency-file/pyproject.toml
      union-project: dataplattform
      union-domain: development
      environment: dev
  container-task-dev:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yaml
    with:
      flyte-task-file: ./tests/tasks/container-task/main.py
      dependency-file: ./tests/tasks/container-task/pyproject.toml
      union-project: dataplattform
      union-domain: development
      environment: dev
  requirements-dev:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yaml
    with:
      flyte-task-file: ./tests/tasks/requirements-dependency-file/main.py
      dependency-file: ./tests/tasks/requirements-dependency-file/requirements.txt
      union-project: dataplattform
      union-domain: staging
      environment: dev
  python-version-dev:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yaml
    with:
      flyte-task-file: ./tests/tasks/requirements-dependency-file/main.py
      dependency-file: ./tests/tasks/requirements-dependency-file/requirements.txt
      union-project: dataplattform
      union-domain: development
      environment: dev
      python-version: 3.14
  pyproject-dependecy-file-prod:
    needs:
      - pyproject-dependecy-file-dev
      - container-task-dev
      - requirements-dev
      - python-version-dev
      - flyte-task-version-dev
      - pyproject-single-group-dev
      - pyproject-multiple-groups-dev
      - pyproject-workspace-dev
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yaml
    with:
      flyte-task-file: ./tests/tasks/pyproject-dependency-file/main.py
      dependency-file: ./tests/tasks/pyproject-dependency-file/pyproject.toml
      union-project: dataplattform
      union-domain: production
      environment: prod
  container-task-prod:
    needs:
      - pyproject-dependecy-file-dev
      - container-task-dev
      - requirements-dev
      - python-version-dev
      - flyte-task-version-dev
      - pyproject-single-group-dev
      - pyproject-multiple-groups-dev
      - pyproject-workspace-dev
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yaml
    with:
      flyte-task-file: ./tests/tasks/container-task/main.py
      dependency-file: ./tests/tasks/container-task/pyproject.toml
      union-project: dataplattform
      union-domain: development
      environment: prod
  requirements-prod:
    needs:
      - pyproject-dependecy-file-dev
      - container-task-dev
      - requirements-dev
      - python-version-dev
      - flyte-task-version-dev
      - pyproject-single-group-dev
      - pyproject-multiple-groups-dev
      - pyproject-workspace-dev
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yaml
    with:
      flyte-task-file: ./tests/tasks/requirements-dependency-file/main.py
      dependency-file: ./tests/tasks/requirements-dependency-file/requirements.txt
      union-project: dataplattform
      union-domain: staging
      environment: prod
  python-version-prod:
    needs:
      - pyproject-dependecy-file-dev
      - container-task-dev
      - requirements-dev
      - python-version-dev
      - flyte-task-version-dev
      - pyproject-single-group-dev
      - pyproject-multiple-groups-dev
      - pyproject-workspace-dev
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yaml
    with:
      flyte-task-file: ./tests/tasks/requirements-dependency-file/main.py
      dependency-file: ./tests/tasks/requirements-dependency-file/requirements.txt
      union-project: dataplattform
      union-domain: development
      environment: prod
      python-version: 3.14
  flyte-task-version-prod:
    needs:
      - pyproject-dependecy-file-dev
      - container-task-dev
      - requirements-dev
      - python-version-dev
      - flyte-task-version-dev
      - pyproject-single-group-dev
      - pyproject-multiple-groups-dev
      - pyproject-workspace-dev
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yaml
    with:
      flyte-task-file: ./tests/tasks/pyproject-dependency-file/main.py
      flyte-task-version: 0.0.3
      dependency-file: ./tests/tasks/pyproject-dependency-file/pyproject.toml
      union-project: dataplattform
      union-domain: development
      environment: prod
