version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # Use uv support to keep manifests and their lockfiles in sync.
  - package-ecosystem: uv
    directories:
      - /tests/tasks/container-task
      - /tests/tasks/multiple-environments
      - /tests/tasks/pyproject-dependency-file
      - /tests/tasks/pyproject-groups
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # These examples use requirements.txt or a pyproject.toml without a lockfile.
  - package-ecosystem: pip
    directories:
      - /tests/tasks/requirements-dependency-file
      - /tests/tasks/pyproject-workspace/packages/task
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
